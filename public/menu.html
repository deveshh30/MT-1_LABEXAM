<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Menu</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background: #f8f8f8;
      }
      h1 {
        color: #333;
      }
      ul {
        background: white;
        padding: 20px 30px;
        border-radius: 8px;
      }
      li {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>Our Menu</h1>
    <ul>
      <li>Pizza - ₹250</li>
      <li>Burger - ₹180</li>
      <li>Salad - ₹140</li>
    </ul>
  </body>
</html>
